AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SafePath Bengal static community map and report API.

Parameters:
  StageName:
    Type: String
    Default: prod
    AllowedPattern: '[a-zA-Z0-9-]+'
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:8000,http://localhost:8001
    Description: Browser origins allowed to call the API directly; same-origin CloudFront requests need no CORS entry.
  ModeratorToken:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Random secret for status updates. Never place this value in frontend files.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 256

Resources:
  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: reportId
          AttributeType: S
        - AttributeName: locationKey
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: reportId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: DuplicateLookup
          KeySchema:
            - AttributeName: locationKey
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY

  ReportsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization
        MaxAge: 300
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: lambda/index.handler
      Environment:
        Variables:
          REPORTS_TABLE: !Ref ReportsTable
          MODERATOR_TOKEN: !Ref ModeratorToken
          ALLOWED_ORIGINS: !Join [",", !Ref AllowedOrigins]
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReportsTable
      Events:
        ListReports:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReportsApi
            Path: /reports
            Method: GET
        CreateReport:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReportsApi
            Path: /reports
            Method: POST
        GetReport:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReportsApi
            Path: /reports/{reportId}
            Method: GET
        UpdateReportStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReportsApi
            Path: /reports/{reportId}/status
            Method: PATCH

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site-oac'
        Description: Private access from CloudFront to the static site bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: SafePath Bengal community map
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: SiteOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: ApiOrigin
            DomainName: !Sub '${ReportsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            OriginPath: !Sub '/${StageName}'
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: SiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /reports*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            CachePolicyId: 413f1601-e310-4b67-8a4c-42d7bb5c5a6c
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Restrictions:
          GeoRestriction:
            RestrictionType: none
      Tags:
        - Key: Project
          Value: SafePathBengal

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

Outputs:
  WebsiteUrl:
    Description: HTTPS website URL.
    Value: !Sub 'https://${SiteDistribution.DomainName}'
  DistributionId:
    Description: CloudFront distribution ID for cache invalidation.
    Value: !Ref SiteDistribution
  SiteBucketName:
    Description: Private bucket for static site files.
    Value: !Ref SiteBucket
  ApiEndpoint:
    Description: API Gateway endpoint; public writes are validated and throttled.
    Value: !Sub 'https://${ReportsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/'
  ReportsTableName:
    Description: DynamoDB reports table.
    Value: !Ref ReportsTable